name: Docker Build and Push

on:
  push:
    branches:
      - '*'  # 触发所有分支
  pull_request:
    branches:
      - '*'  # 触发所有分支

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image_name: library/sonarqube
            image_version: lts-community
          - image_name: sonarsource/sonar-scanner-cli
            image_version: latest
          - image_name: library/postgres
            image_version: "15"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}

    - name: Pull Docker image from Docker Hub
      run: |
        echo "Pulling Docker image: ${{ matrix.image_name }}:${{ matrix.image_version }}"
        docker pull ${{ matrix.image_name }}:${{ matrix.image_version }}

    - name: Tag Docker image for GitHub Packages
      run: |
        OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "Tagging Docker image for GitHub Packages"
        echo "ghcr.io/${OWNER_LOWERCASE}/sig-storage/${{ matrix.image_name }}:${{ matrix.image_version }}"
        docker tag ${{ matrix.image_name }}:${{ matrix.image_version }} ghcr.io/${OWNER_LOWERCASE}/sig-storage/${{ matrix.image_name }}:${{ matrix.image_version }}

    - name: Push Docker image to GitHub Container Registry
      run: |
        OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "Pushing Docker image to GitHub Container Registry"
        docker push ghcr.io/${OWNER_LOWERCASE}/sig-storage/${{ matrix.image_name }}:${{ matrix.image_version }}
